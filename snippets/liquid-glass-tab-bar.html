<div class="glass" style="--radius:32px; --blur-fallback:14px; width:340px; height:64px">
  <div class="glass__optic"></div>
  <div class="glass__glow"></div>
  <div class="glass__rim"></div>
  <div class="glass__content">Home · Search · Library</div>
</div>

<style>
:root {
  --glass-fill: rgba(255,255,255,.15);
  --glass-rim-key: rgba(255,255,255,.96);
  --glass-rim-side: rgba(255,255,255,.24);
  --glass-rim-counter: rgba(255,255,255,.56);
  --glass-edge: rgba(0,0,0,.12);
  --glass-ink: #1d1d1f;
}
@media (prefers-color-scheme: dark) {
  :root { --glass-fill: rgba(18,18,24,.30); --glass-rim-key: rgba(255,255,255,.68); --glass-rim-side: rgba(255,255,255,.14);
          --glass-rim-counter: rgba(255,255,255,.35); --glass-edge: rgba(0,0,0,.32); --glass-ink: #fff; }
}
/* The edge line is a 1 px ring outside the silhouette, drawn with the shadow so it follows the radius. */
.glass { position: relative; isolation: isolate; border-radius: var(--radius);
  box-shadow: 0 0 0 1px var(--glass-edge), 0 8px 28px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.08); color: var(--glass-ink);
  /* the host must paint nothing: a <button>/<input> host otherwise brings the UA face colour
     (grey rgb(107,107,107) under color-scheme: dark) and the optic refracts that instead of the page */
  background: transparent; border: 0; -webkit-appearance: none; appearance: none; font: inherit; }
.glass > * { position: absolute; inset: 0; border-radius: inherit; }
.glass__optic { background: var(--glass-fill);
  -webkit-backdrop-filter: blur(var(--blur-fallback, 12px)) saturate(1.5);
  backdrop-filter: blur(var(--blur-fallback, 12px)) saturate(1.5); }
.glass__glow { pointer-events: none;
  box-shadow: inset 2px 3px 8px -4px rgba(255,255,255,.8),
              inset -2px -3px 8px -4px rgba(255,255,255,.35); }
/* Offset inset highlights follow the silhouette: the lit band is widest where the edge faces the light,
   so a wide capsule is lit along its whole top edge (a 135° gradient border would light only its left end). */
.glass__rim { pointer-events: none;
  box-shadow: inset 1.5px 1.5px 0 -.5px var(--glass-rim-key),
              inset -1.5px -1.5px 0 -.5px var(--glass-rim-counter),
              inset 0 0 0 .5px var(--glass-rim-side); }
.glass__content { position: relative; inset: auto; }
@media (prefers-reduced-transparency: reduce) {
  .glass__optic { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(245,245,247,.92); }
}
.glass__content { display: grid; place-items: center; height: 100%; }
</style>

<script>
  // Chromium is the only engine that renders an SVG filter inside backdrop-filter; Safari and Firefox keep the frost.
  if (("userAgentData" in navigator || /\bChrome\/\d+/.test(navigator.userAgent)) && !/Firefox|FxiOS|CriOS|EdgiOS/.test(navigator.userAgent))
    for (const el of document.querySelectorAll(".glass__optic")) el.style.backdropFilter = "url(#liquid-glass)";
</script>
